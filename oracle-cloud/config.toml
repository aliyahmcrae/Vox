[gpt]
MODEL = "gpt-4o-mini"
MAX_TOKENS = 150
SAMPLE_RATE = 16000

[intent]
# Lightweight model used only to decide when a complete, assistant-directed
# request has been spoken. CONTEXT_LENGTH = how many recent transcript lines
# to consider when making that decision.
MODEL = "gpt-4o-mini"
CONTEXT_LENGTH = 20